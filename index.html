<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualTimer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="timer-display">
            <span id="hours">00</span>:<span id="minutes">00</span>:<span id="seconds">00</span>
        </div>

        <div class="progress-section">
            <button id="subtract-btn" class="btn btn-adjust">
                <svg viewBox="0 0 100 100" class="arrow-icon">
                    <path class="arrow-curve" d="M 50 80 A 30 30 0 0 0 50 20" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    <polygon class="arrow-head" points="38,20 50,12 50,28" fill="currentColor"/>
                    <text x="50" text-anchor="middle" class="arrow-text">
                        <tspan x="50" dy="46">-5</tspan>
                        <tspan x="50" dy="14">sec</tspan>
                    </text>
                </svg>
            </button>
            <div class="progress-ring">
                <svg viewBox="0 0 200 200">
                    <circle class="progress-bg" cx="100" cy="100" r="90"></circle>
                    <circle class="progress" id="progress-circle" cx="100" cy="100" r="90"></circle>
                </svg>
            </div>
            <button id="add-btn" class="btn btn-adjust">
                <svg viewBox="0 0 100 100" class="arrow-icon">
                    <path class="arrow-curve" d="M 50 80 A 30 30 0 0 1 50 20" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    <polygon class="arrow-head" points="62,20 50,12 50,28" fill="currentColor"/>
                    <text x="50" text-anchor="middle" class="arrow-text">
                        <tspan x="50" dy="46">+5</tspan>
                        <tspan x="50" dy="14">sec</tspan>
                    </text>
                </svg>
            </button>
        </div>

        <div class="input-group">
            <label>
                <input type="number" id="input-hours" min="0" max="99" value="0" placeholder="0">
                <span>Hours</span>
            </label>
            <label>
                <input type="number" id="input-minutes" min="0" max="59" value="5" placeholder="0">
                <span>Minutes</span>
            </label>
            <label>
                <input type="number" id="input-seconds" min="0" max="59" value="0" placeholder="0">
                <span>Seconds</span>
            </label>
        </div>

        <div class="controls">
            <button id="play-pause-btn" class="btn btn-play-pause">
                <svg viewBox="0 0 24 24" class="icon-play">
                    <polygon points="5,3 19,12 5,21" fill="currentColor"/>
                </svg>
                <svg viewBox="0 0 24 24" class="icon-pause">
                    <rect x="4" y="3" width="6" height="18" fill="currentColor"/>
                    <rect x="14" y="3" width="6" height="18" fill="currentColor"/>
                </svg>
            </button>
            <button id="reset-btn" class="btn btn-reset">Reset</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
