<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VisualTimer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card-container">
        <div class="card" id="card">
            <!-- Front Side - Timer -->
            <div class="card-face card-front">
                <button id="settings-btn" class="settings-btn" aria-label="Settings">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97 0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1 0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66z"/>
                    </svg>
                </button>

                <div class="timer-display">
                    <span id="minutes">00</span>:<span id="seconds">00</span>
                </div>

                <div class="progress-ring">
                    <svg viewBox="0 0 200 200">
                        <circle class="progress-bg" cx="100" cy="100" r="90"></circle>
                        <circle class="progress" id="progress-circle" cx="100" cy="100" r="90"></circle>
                    </svg>
                </div>

                <div class="adjust-buttons">
                    <button id="add-btn" class="btn btn-adjust">
                        <svg viewBox="0 0 100 100" class="arrow-icon">
                            <path class="arrow-curve" d="M 50 20 A 30 30 0 0 1 50 80" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                            <polygon class="arrow-head" points="38,80 50,72 50,88" fill="currentColor"/>
                            <text x="50" y="55" text-anchor="middle" class="arrow-text">+5</text>
                        </svg>
                    </button>
                    <button id="subtract-btn" class="btn btn-adjust">
                        <svg viewBox="0 0 100 100" class="arrow-icon">
                            <path class="arrow-curve" d="M 50 20 A 30 30 0 0 0 50 80" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                            <polygon class="arrow-head" points="62,80 50,72 50,88" fill="currentColor"/>
                            <text x="50" y="55" text-anchor="middle" class="arrow-text">-5</text>
                        </svg>
                    </button>
                </div>

                <div class="controls">
                    <button id="play-pause-btn" class="btn btn-play-pause">
                        <svg viewBox="0 0 24 24" class="icon-play">
                            <polygon points="5,3 19,12 5,21" fill="currentColor"/>
                        </svg>
                        <svg viewBox="0 0 24 24" class="icon-pause">
                            <rect x="4" y="3" width="6" height="18" fill="currentColor"/>
                            <rect x="14" y="3" width="6" height="18" fill="currentColor"/>
                        </svg>
                    </button>
                    <button id="reset-btn" class="btn btn-reset">Reset</button>
                </div>
            </div>

            <!-- Back Side - Settings -->
            <div class="card-face card-back">
                <h2 class="settings-title">Settings</h2>

                <div class="setting-row">
                    <span class="setting-label">Sound</span>
                    <button id="mute-toggle" class="mute-toggle">
                        <svg viewBox="0 0 24 24" class="icon-sound-on" fill="currentColor">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                        </svg>
                        <svg viewBox="0 0 24 24" class="icon-sound-off" fill="currentColor">
                            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                        </svg>
                    </button>
                </div>

                <div class="setting-section">
                    <span class="setting-label">Set Time</span>
                    <div class="input-group">
                        <label>
                            <input type="number" id="input-minutes" min="0" max="59" value="1" placeholder="0">
                            <span>Min</span>
                        </label>
                        <label>
                            <input type="number" id="input-seconds" min="0" max="59" value="30" placeholder="0">
                            <span>Sec</span>
                        </label>
                    </div>
                </div>

                <div class="setting-section">
                    <span class="setting-label">Presets</span>
                    <div class="preset-grid">
                        <button class="preset-btn" data-time="15">0:15</button>
                        <button class="preset-btn" data-time="30">0:30</button>
                        <button class="preset-btn" data-time="45">0:45</button>
                        <button class="preset-btn" data-time="60">1:00</button>
                        <button class="preset-btn" data-time="75">1:15</button>
                        <button class="preset-btn" data-time="90">1:30</button>
                        <button class="preset-btn" data-time="105">1:45</button>
                        <button class="preset-btn" data-time="120">2:00</button>
                        <button class="preset-btn" data-time="135">2:15</button>
                        <button class="preset-btn" data-time="150">2:30</button>
                        <button class="preset-btn" data-time="165">2:45</button>
                        <button class="preset-btn" data-time="180">3:00</button>
                        <button class="preset-btn" data-time="195">3:15</button>
                        <button class="preset-btn" data-time="210">3:30</button>
                        <button class="preset-btn" data-time="225">3:45</button>
                        <button class="preset-btn" data-time="240">4:00</button>
                        <button class="preset-btn" data-time="255">4:15</button>
                        <button class="preset-btn" data-time="270">4:30</button>
                        <button class="preset-btn" data-time="285">4:45</button>
                        <button class="preset-btn" data-time="300">5:00</button>
                    </div>
                </div>

                <button id="done-btn" class="btn btn-done">Done</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
