<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Stopwatch button/stem -->
  <rect x="28" y="2" width="8" height="10" rx="2" fill="#1a1a2e"/>

  <!-- Small side button -->
  <rect x="48" y="12" width="6" height="4" rx="1" fill="#1a1a2e" transform="rotate(45 51 14)"/>

  <!-- Outer circle (ring) -->
  <circle cx="32" cy="36" r="24" fill="none" stroke="#1a1a2e" stroke-width="5"/>

  <!-- Progress wedge (countdown indicator) - shows ~40% remaining -->
  <path d="M32,36 L32,12 A24,24 0 0,1 53.5,48 Z" fill="#4ecdc4"/>
</svg>
